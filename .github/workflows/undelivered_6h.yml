name: Undelivered VINs past 6h to Slack

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0,6,12,18 * * *"   # 06:00, 12:00, 18:00, 00:00 IST

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install playwright slack_sdk
          playwright install chromium
      - name: Build and post report
        env:
          MB_URL: https://metabase.spyne.ai
          MB_USER: ${{ secrets.METABASE_USER }}
          MB_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          MB_CARD_ID: ${{ vars.UNDELIVERED_6H_CARD_ID }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.UNDELIVERED_6H_CHANNEL_ID }}
          OUT_DIR: ${{ runner.temp }}
        run: python undelivered_report.py
